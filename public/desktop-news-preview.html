) minmax(0,1fr)}\n  .atlas-desktop-shell.is-reading-news{grid-template-columns:clamp(380px,32vw,520px) minmax(0,1fr)}\n  .atlas-desktop-shell .atlas-explorer .atlas-primary-grid{grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr);gap:16px}\n  .atlas-desktop-shell .atlas-explorer .atlas-map-frame{min-height:300px;max-height:640px;aspect-ratio:1.55}\n  .atlas-desktop-shell .atlas-explorer .atlas-map-column{min-width:0;top:12px}\n  .atlas-desktop-shell .atlas-primary-grid>*{min-width:0}\n}\n/* Basic safe fallback, without redesigning the tablet/mobile layouts. */\n@media(max-width:1199px){\n  .atlas-desktop-shell{display:flex;flex-direction:column;padding:12px 16px 28px}\n  .atlas-news{position:relative;top:auto;width:100%;height:300px;min-height:0}\n  .atlas-desktop-shell.is-reading-news .atlas-news{height:70dvh}\n  .atlas-news-header{padding:12px 16px}.atlas-news-header h2{font-size:18px}.atlas-news-header>p{display:none}\n}\n"};
const frame=document.getElementById('preview'),field=document.getElementById('field'),size=document.getElementById('size'),expanded=document.getElementById('expanded');
function resize(){const [w,h]=size.value.split(',').map(Number),scale=Math.min(1,innerWidth/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.getElementById('stage').style.height=h*scale+'px'}
async function load(){document.getElementById('status').textContent='読込中';const url=new URL('/insight-journal/atlas/north-america/'+field.value+'/',location.origin);const response=await fetch(url);if(!response.ok)throw Error(response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html');const base=doc.createElement('base');base.href=url.href;doc.head.prepend(base);const style=doc.createElement('style');style.textContent=data.css;doc.head.append(style);const article=doc.querySelector('[data-atlas-explorer]');const shell=doc.createElement('div');shell.className='atlas-desktop-shell'+(expanded.checked?' is-reading-news':'');shell.dataset.atlasShell='';article.before(shell);shell.innerHTML=data.rail;shell.append(article);frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;resize();document.getElementById('status').textContent='公開中の本文＋PRの共通配置（未公開）'}
field.onchange=load;size.onchange=resize;expanded.onchange=()=>frame.contentDocument.querySelector('[data-atlas-shell]').classList.toggle('is-reading-news',expanded.checked);window.onresize=resize;load().catch(e=>document.getElementById('status').textContent=String(e));
</script></html>
