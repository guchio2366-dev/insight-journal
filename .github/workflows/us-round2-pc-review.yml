name: Review US round2 maps
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/atlas/AtlasExplorer.astro'
      - 'src/components/atlas/NaturalEnvironmentSummary.astro'
      - 'src/scripts/atlas-*.ts'
      - 'src/data/atlas/water-resources.ts'
      - 'scripts/capture-us-round2-review.mjs'
      - 'scripts/verify-us-religion-paint.mjs'
      - '.github/workflows/us-round2-pc-review.yml'
permissions:
  contents: read
concurrency:
  group: us-round2-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Check the exact reviewed head
        env:
          US_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$US_REVIEW_HEAD_SHA"
          npm test
          npm run build
          node scripts/generate-release.mjs --commit "$US_REVIEW_HEAD_SHA"
          npm run test:e2e
          node scripts/verify-release.mjs --commit "$US_REVIEW_HEAD_SHA"
      - name: Capture normal US maps
        run: |
          sudo apt-get install -y fonts-noto-cjk
          REVIEW_CHROME_PATH="$(command -v google-chrome)" node scripts/capture-us-round2-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-round2-${{ github.run_id }}
          path: review-artifacts/us-round2
          retention-days: 7
