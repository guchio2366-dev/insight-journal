name: Package South Central core review images

on:
  pull_request:
    branches: [codex/south-central-insights-20261008]
    paths: ['.github/workflows/atlas-south-central-pc-samples.yml']

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the existing successful PC review
        uses: actions/download-artifact@v4
        with:
          name: asia-pc-review-37758284170-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37758284170
          path: incoming

      - name: Select South Central Asia core review images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('incoming')
          output=Path('selected')
          output.mkdir()
          names=[
            'desktop-south-central-asia-farm-overview.png',
            'desktop-south-central-asia-city-first.png',
            'desktop-south-central-asia-rainfall-no-country-popup.png',
            'desktop-south-central-asia-basin-selection-retained.png',
            'south-desktop-south-central-industry-overview.png',
          ]
          total=0
          for name in names:
            matches=list(source.rglob(name))
            assert len(matches)==1, (name,matches)
            shutil.copyfile(matches[0],output/name)
            total+=(output/name).stat().st_size
          assert total<=10*1024*1024, total
          print(f'{len(names)} existing images: {total} bytes')
          PY

      - name: Upload focused review images
        uses: actions/upload-artifact@v4
        with:
          name: south-central-core-review-${{ github.run_id }}
          path: selected
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
