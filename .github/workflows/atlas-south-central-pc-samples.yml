name: Review South Central landform and elevation on PC

on:
  pull_request:
    branches: [codex/south-central-insights-20261008]
    paths:
      - '.github/workflows/atlas-south-central-pc-samples.yml'
      - 'scripts/capture-south-central-pc-samples.mjs'

# Review artifacts only. No deployment or repository writes.
permissions:
  contents: read
  actions: read

concurrency:
  group: south-central-pc-samples-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_SCENE: south-central-landform-overview

    steps:
      - name: Check out exact sample head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify existing Chrome and Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::The runner must provide Chrome."
            exit 1
          fi
          japanese_fonts="$(fc-list ':lang=ja' family)"
          font_setup="preinstalled"
          if [[ -z "$japanese_fonts" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
            japanese_fonts="$(fc-list ':lang=ja' family)"
            font_setup="installed-fonts-noto-cjk-from-ubuntu"
          fi
          if [[ -z "$japanese_fonts" ]]; then
            echo "::error::Japanese fonts are required."
            exit 1
          fi
          {
            printf 'REVIEW_CHROME_PATH=%s\n' "$chrome_path"
            printf 'REVIEW_JAPANESE_FONT_SETUP=%s\n' "$font_setup"
            printf '%s\n' 'REVIEW_JAPANESE_FONTS<<SOUTH_CENTRAL_FONTS' "$japanese_fonts" 'SOUTH_CENTRAL_FONTS'
            printf '%s\n' 'REVIEW_JAPANESE_FONT_MATCH<<SOUTH_CENTRAL_MATCH'
            fc-match -f '%{family}\n' 'sans-serif:lang=ja'
            fc-match -f '%{family}\n' 'serif:lang=ja'
            printf '%s\n' 'SOUTH_CENTRAL_MATCH'
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local production site
        run: npm run build

      - name: Capture landform overview
        timeout-minutes: 3
        run: node scripts/capture-south-central-pc-samples.mjs

      - name: Download the existing elevation image
        uses: actions/download-artifact@v4
        with:
          name: asia-pc-review-37758284170-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37758284170
          path: incoming

      - name: Keep only landform and elevation images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          out=Path('review-artifacts/south-central-terrain-review')
          out.mkdir(parents=True,exist_ok=True)
          name='south-central-landform-overview.png'
          source=Path('review-artifacts/south-central-pc-samples')/name
          assert source.is_file(), name
          shutil.copyfile(source,out/name)
          name='south-desktop-south-central-asia-aligned-terrain-overview.png'
          matches=list(Path('incoming').rglob(name))
          assert len(matches)==1,(name,matches)
          shutil.copyfile(matches[0],out/name)
          images=list(out.glob('*.png'))
          assert len(images)==2
          total=sum(p.stat().st_size for p in images)
          assert total<=10*1024*1024,total
          print(f'Two PC images: {total} bytes')
          PYCODE

      - name: Upload focused terrain images
        uses: actions/upload-artifact@v4
        with:
          name: south-central-terrain-review-${{ github.run_id }}
          path: review-artifacts/south-central-terrain-review/*.png
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
