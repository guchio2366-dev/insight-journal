name: Review approved East Asia on PC

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-asia-pc-review.yml'
      - 'scripts/capture-east-asia-approved-review.mjs'
      - 'src/data/atlas/east-asia-*'
      - 'src/scripts/atlas-east-asia-*'
      - 'src/lib/atlas-east-industry-labels.ts'
      - 'tests/unit/atlas-east-industry-labels.test.mjs'
      - 'src/components/atlas/asia/EastAsia*'
      - 'src/styles/atlas-east-asia-*'
      - 'src/components/atlas/Asia*.astro'
      - 'src/components/atlas/WestAsia*.astro'
      - 'src/data/atlas/west-asia*'
      - 'src/scripts/atlas-west-asia.ts'
      - 'src/lib/atlas-west-asia*.mjs'
      - 'src/styles/atlas-west-asia.css'
      - 'tests/unit/atlas-west-asia*.test.mjs'
      - 'tests/e2e/atlas-west-asia*.test.mjs'
      - 'src/data/atlas/asia*'
      - 'src/data/atlas/asia/**'
      - 'src/scripts/atlas-asia-*.ts'
      - 'src/lib/atlas-asia*.ts'
      - 'src/styles/atlas-asia*.css'
      - 'src/pages/atlas/asia/**'
      - 'public/assets/atlas/asia*/**'
      - 'tests/e2e/atlas-asia-*.test.mjs'
      - 'tests/e2e/atlas-south-central-focus.test.mjs'
      - 'tests/unit/atlas-asia-*.test.mjs'
  push:
    branches: [fix/asia-industry-publication-status]
    paths:
      - '.github/workflows/atlas-asia-pc-review.yml'
      - 'scripts/capture-east-asia-approved-review.mjs'
      - 'src/data/atlas/east-asia-*'
      - 'src/scripts/atlas-east-asia-*'
      - 'src/lib/atlas-east-industry-labels.ts'
      - 'tests/unit/atlas-east-industry-labels.test.mjs'
      - 'src/components/atlas/asia/EastAsia*'
      - 'src/styles/atlas-east-asia-*'
      - 'src/components/atlas/Asia*.astro'
      - 'src/components/atlas/WestAsia*.astro'
      - 'src/data/atlas/west-asia*'
      - 'src/scripts/atlas-west-asia.ts'
      - 'src/lib/atlas-west-asia*.mjs'
      - 'src/styles/atlas-west-asia.css'
      - 'tests/unit/atlas-west-asia*.test.mjs'
      - 'tests/e2e/atlas-west-asia*.test.mjs'
      - 'src/data/atlas/asia*'
      - 'src/data/atlas/asia/**'
      - 'src/scripts/atlas-asia-*.ts'
      - 'src/lib/atlas-asia*.ts'
      - 'src/styles/atlas-asia*.css'
      - 'src/pages/atlas/asia/**'
      - 'public/assets/atlas/asia*/**'
      - 'tests/e2e/atlas-asia-*.test.mjs'
      - 'tests/e2e/atlas-south-central-focus.test.mjs'
      - 'tests/unit/atlas-asia-*.test.mjs'

# Test artifacts only: no deployment, repository writes, or application secrets.
permissions:
  contents: read

concurrency:
  group: asia-pc-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Verify approved East Asia PC views
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      REVIEW_BEFORE_SHA: ${{ github.event.before || '' }}

    steps:
      - name: Check out the image generation commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Chrome and Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::The runner must already provide Chrome; no browser installation is performed."
            exit 1
          fi
          japanese_fonts="$(fc-list ':lang=ja' family)"
          font_setup="preinstalled"
          # Match the existing Validate site's temporary runner dependency.
          # This changes no token permissions, repository settings, or trust.
          if [[ -z "$japanese_fonts" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
            japanese_fonts="$(fc-list ':lang=ja' family)"
            font_setup="installed-fonts-noto-cjk-from-ubuntu"
          fi
          if [[ -z "$japanese_fonts" ]]; then
            echo "::error::Japanese fonts are required; unreadable screenshots are not accepted."
            exit 1
          fi
          {
            printf 'REVIEW_CHROME_PATH=%s\n' "$chrome_path"
            printf 'REVIEW_JAPANESE_FONT_SETUP=%s\n' "$font_setup"
            printf '%s\n' 'REVIEW_JAPANESE_FONTS<<ASIA_PC_FONTS' "$japanese_fonts" 'ASIA_PC_FONTS'
            printf '%s\n' 'REVIEW_JAPANESE_FONT_MATCH<<ASIA_PC_MATCH'
            fc-match -f '%{family}\n' 'sans-serif:lang=ja'
            fc-match -f '%{family}\n' 'serif:lang=ja'
            printf '%s\n' 'ASIA_PC_MATCH'
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local production site
        run: npm run build

      - name: Verify South and Central Asia regional journeys
        timeout-minutes: 4
        run: ATLAS_ASIA_BROWSER=1 node --test tests/e2e/atlas-south-central-focus.test.mjs

      # East Asia map expansion supersedes the former exact US frame parity.
      # The former broad comparison script remains available for manual review.
      - name: Capture PC images and verify controls
        timeout-minutes: 9
        run: node scripts/capture-east-asia-approved-review.mjs

      - name: Save PC images and verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: east-asia-approved-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-artifacts/east-asia-approved
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
