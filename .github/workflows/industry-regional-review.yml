name: Review regional industry additions
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact main SHA already deployed to the existing Pages site'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*industry*'
      - 'src/**/*Industry*'
      - 'src/**/*russia*'
      - 'src/components/atlas/EuropeAtlasPage.astro'
      - 'src/lib/atlas-europe-explorer.ts'
      - 'src/lib/atlas-latin-learning-state.ts'
      - 'src/scripts/atlas-latin-essential-legends.ts'
      - 'scripts/verify-*-industry*-review.mjs'
      - 'scripts/*canada-industry*.mjs'
      - 'src/lib/atlas-canada-industry-pilot.ts'
      - '.github/workflows/industry-regional-review.yml'
permissions:
  contents: read
concurrency:
  group: industry-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Retrieve Canada review sources with normal HTTPS
        if: github.event_name == 'pull_request' && contains(github.head_ref, 'canada-map-revision')
        run: python3 scripts/acquire-canada-review-sources.py
      - run: npm run build
        if: github.event_name == 'pull_request'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - name: Verify industry maps and capture evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(fc-list ':lang=ja' family)"
          export INDUSTRY_REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          export CANADA_REVIEW_LOG_IMAGES=0
          for review in scripts/verify-latin-industry-locations-review.mjs scripts/verify-russia-industry-review.mjs scripts/verify-industry-existing-country-review.mjs scripts/capture-canada-industry-pilot-review.mjs; do
            if [[ -f "$review" ]]; then node "$review"; fi
          done
      - name: Verify the deployed approved Pages release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          test -n "$(fc-list ':lang=ja' family)"
          export INDUSTRY_REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/verify-approved-pages-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-map-review-${{ github.run_id }}
          path: review-artifacts/
          retention-days: 7
          if-no-files-found: error
