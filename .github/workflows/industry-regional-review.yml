name: Review regional industry additions
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact main SHA already deployed to the existing Pages site'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*industry*'
      - 'src/**/*Industry*'
      - 'src/**/*russia*'
      - 'src/components/atlas/EuropeAtlasPage.astro'
      - 'src/lib/atlas-europe-explorer.ts'
      - 'src/lib/atlas-latin-learning-state.ts'
      - 'src/scripts/atlas-latin-essential-legends.ts'
      - 'scripts/verify-*-industry*-review.mjs'
      - 'scripts/verify-industry-pages-smoke.mjs'
      - 'scripts/run-review-with-annotations.mjs'
      - 'scripts/*canada-industry*.mjs'
      - 'src/lib/atlas-canada-industry-pilot.ts'
      - '.github/workflows/industry-regional-review.yml'
permissions:
  contents: read
concurrency:
  group: industry-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        if: github.event_name == 'pull_request'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - name: Verify world industry map and value flow together
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/verify-world-industry.mjs ]]; then
            WORLD_INDUSTRY_LOG_IMAGES=1 REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" node scripts/run-review-with-annotations.mjs scripts/verify-world-industry.mjs
          fi
      - name: Verify industry maps and capture evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(fc-list ':lang=ja' family)"
          export INDUSTRY_REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          export REVIEW_CHROME_PATH="$INDUSTRY_REVIEW_CHROME_PATH"
          if [[ "${GITHUB_HEAD_REF:-}" == "codex/canada-map-revision-20261011" ]]; then export CANADA_REVIEW_LOG_IMAGES=1; fi
          if [[ "${GITHUB_HEAD_REF:-}" == "codex/canada-map-followup-20261012" ]]; then
            canada_followup_status=0
            node scripts/run-review-with-annotations.mjs scripts/verify-canada-industry-followup-review.mjs || canada_followup_status=$?
            CANADA_REVIEW_LOG_IMAGES=0 ATLAS_CHROMIUM_PATH="$INDUSTRY_REVIEW_CHROME_PATH" ATLAS_QA_OUTPUT="review-artifacts/canada-maps" node scripts/run-review-with-annotations.mjs scripts/verify-canada-us-parity.mjs || canada_followup_status=$?
            if [[ "$canada_followup_status" != 0 ]]; then exit "$canada_followup_status"; fi
          fi
          for review in scripts/verify-latin-industry-locations-review.mjs scripts/verify-russia-industry-review.mjs scripts/verify-industry-existing-country-review.mjs scripts/capture-canada-industry-pilot-review.mjs; do
            if [[ -f "$review" ]]; then node scripts/run-review-with-annotations.mjs "$review"; fi
          done
          if [[ -f scripts/verify-east-asia-industries.mjs ]]; then
            EAST_INDUSTRY_REVIEW_OUTPUT=review-artifacts/east-asia-industries node scripts/run-review-with-annotations.mjs scripts/verify-east-asia-industries.mjs
          fi
          if [[ -f scripts/verify-central-asia-industry.mjs ]]; then
            CENTRAL_REVIEW_OUTPUT=review-artifacts/central-asia-industry node scripts/run-review-with-annotations.mjs scripts/verify-central-asia-industry.mjs
          fi
          if [[ "${GITHUB_HEAD_REF:-}" == "codex/canada-map-revision-20261011" ]]; then
            CANADA_REVIEW_LOG_IMAGES=0 ATLAS_CHROMIUM_PATH="$INDUSTRY_REVIEW_CHROME_PATH" ATLAS_QA_OUTPUT="review-artifacts/canada-maps" node scripts/run-review-with-annotations.mjs scripts/verify-canada-us-parity.mjs
          fi
      - name: Verify the deployed approved Pages release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          test -n "$(fc-list ':lang=ja' family)"
          export INDUSTRY_REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/run-review-with-annotations.mjs scripts/verify-approved-pages-release.mjs
          if [[ -f scripts/verify-world-industry.mjs ]]; then
            WORLD_INDUSTRY_LOG_IMAGES=1 WORLD_INDUSTRY_REVIEW_URL=https://guchio2366-dev.github.io/insight-journal/atlas/industry/world/ REVIEW_CHROME_PATH="$INDUSTRY_REVIEW_CHROME_PATH" node scripts/run-review-with-annotations.mjs scripts/verify-world-industry.mjs
          fi
          INDUSTRY_SMOKE_TARGET=production REVIEW_CHROME_PATH="$INDUSTRY_REVIEW_CHROME_PATH" node scripts/run-review-with-annotations.mjs scripts/verify-industry-pages-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-map-review-${{ github.run_id }}
          path: review-artifacts/
          retention-days: 7
          if-no-files-found: error
  preview:
    name: Industry image preview (${{ matrix.profile }} / ${{ matrix.sector_index }})
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        profile: [historical-pc, portrait]
        sector_index: [0, 1, 2]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: industry-pages-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/industry-pages-smoke-preview
      - name: Export exact captured images in a bounded profile log
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/industry-pages-smoke-preview
          REVIEW_PROFILE: ${{ matrix.profile }}
          REVIEW_SECTOR_INDEX: ${{ matrix.sector_index }}
          REVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['REVIEW_DIRECTORY'])
          report = json.loads((root / 'verification.json').read_text())
          assert report['head'] == os.environ['REVIEW_EXPECTED_HEAD']
          assert report['status'] == 'passed' and not report['failedCases']
          count = 0
          for entry in report['images']:
              if entry['profile']['name'] != os.environ['REVIEW_PROFILE'] or entry['stage'] != 'initial' or entry['sectorIndex'] != int(os.environ['REVIEW_SECTOR_INDEX']):
                  continue
              file = entry['file']
              image = (root / file).resolve()
              assert image.parent == root.resolve()
              data = image.read_bytes()
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              print('INDUSTRY_REVIEW_IMAGE ' + json.dumps({'file': file, 'mimeType': 'image/jpeg', 'base64': base64.b64encode(data).decode()}))
              count += 1
          assert count == 13
          print('INDUSTRY_PROFILE_REVIEW ' + json.dumps({'head': report['head'], 'profile': os.environ['REVIEW_PROFILE'], 'sectorIndex': int(os.environ['REVIEW_SECTOR_INDEX']), 'images': count, 'hashVerified': True}))
          PY
  smoke:
    name: Verify all 13 regional industry pages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      INDUSTRY_SMOKE_LOG_IMAGES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify native operations in sandboxed Chrome
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          test -n "$(fc-list ':lang=ja' family)"
          REVIEW_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" node scripts/run-review-with-annotations.mjs scripts/verify-industry-pages-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-pages-smoke-${{ github.run_id }}
          path: review-artifacts/industry-pages-smoke
          if-no-files-found: warn
          retention-days: 7
