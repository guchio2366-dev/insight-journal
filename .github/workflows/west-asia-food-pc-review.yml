name: Review Mexico and West Asia retained forestry on PC

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/west-asia-food-pc-review.yml'
      - 'scripts/capture-west-asia-forestry-review.mjs'
      - 'scripts/capture-mexico-agriculture-review.mjs'
      - 'src/components/atlas/MexicoAgriculturePage.astro'
      - 'src/components/atlas/MexicoPineFlow.astro'
      - 'src/data/atlas/mexico/pine-flow-2022.json'
      - 'src/styles/atlas-mexico-agriculture-atlas.css'
      - 'tests/unit/atlas-west-asia-forestry.test.mjs'
      - 'tests/e2e/atlas-mexico-agriculture.test.mjs'
      - 'scripts/capture-west-asia-food-review.mjs'
      - 'src/data/atlas/west-asia-*'
      - 'src/lib/atlas-west-asia-farming.mjs'
      - 'src/scripts/atlas-west-asia.ts'
      - 'src/styles/atlas-west-asia.css'
      - 'src/components/atlas/WestAsiaAtlasPage.astro'

permissions:
  contents: read

concurrency:
  group: west-asia-forestry-pc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify runner Chrome and Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::The runner must already provide Chrome."
            exit 1
          fi
          japanese_fonts="$(fc-list ':lang=ja' family)"
          if [[ -z "$japanese_fonts" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
            japanese_fonts="$(fc-list ':lang=ja' family)"
          fi
          if [[ -z "$japanese_fonts" ]]; then
            echo "::error::Japanese fonts are required."
            exit 1
          fi
          {
            printf 'REVIEW_CHROME_PATH=%s\n' "$chrome_path"
            printf '%s\n' 'REVIEW_JAPANESE_FONTS<<WEST_FONTS' "$japanese_fonts" 'WEST_FONTS'
            printf 'REVIEW_JAPANESE_FONT_MATCH=%s\n' "$(fc-match -f '%{family}' 'sans-serif:lang=ja')"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test retained forestry and related regional data
        run: node --test tests/unit/atlas-west-asia*.test.mjs tests/unit/atlas-mexico-agriculture*.test.mjs tests/unit/atlas-production-share*.test.mjs
      - name: Build site
        run: npm run build
      - name: Test built Mexico agriculture and West Asia controllers
        run: node --test --test-concurrency=4 tests/e2e/atlas-mexico-agriculture.test.mjs tests/e2e/atlas-west-asia*.test.mjs
      - name: Verify release boundary
        run: npm run verify:release
      - name: Capture Mexico pine and cattle-milk comparison
        env:
          REVIEW_MEXICO_FORESTRY_ONLY: '1'
        run: node scripts/capture-mexico-agriculture-review.mjs
      - name: Capture wheat selection regression
        run: node scripts/capture-west-asia-food-review.mjs
      - name: Capture forestry overview and Saudi selection
        run: node scripts/capture-west-asia-forestry-review.mjs
      - name: Upload wheat regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: west-asia-farm-map-pc-${{ github.run_id }}
          path: review-artifacts/west-asia-food
          if-no-files-found: error
          retention-days: 7
      - name: Upload forestry PC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: west-asia-forestry-pc-${{ github.run_id }}
          path: review-artifacts/west-asia-forestry
          if-no-files-found: error
          retention-days: 7
      - name: Upload Mexico forestry and dairy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexico-forestry-dairy-pc-${{ github.run_id }}
          path: review-artifacts/mexico-agriculture
          if-no-files-found: error
          retention-days: 7
