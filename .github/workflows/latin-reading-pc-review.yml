name: Latin reading PC review
on:
  pull_request:
    paths:
      - 'src/**/atlas-latin*'
      - 'src/components/atlas/LatinAmerica*'
      - 'src/data/atlas/latin-america/**'
      - 'public/assets/atlas/latin-reading*/**'
      - 'scripts/verify-latin-reading-pc.mjs'
      - 'scripts/verify-latin-culture-pc.mjs'
      - 'scripts/verify-latin-culture-sources.py'
      - 'data-source/atlas/latin-reading/**'
      - '.github/workflows/latin-reading-pc-review.yml'
permissions:
  contents: read
concurrency:
  group: latin-reading-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install ordinary PDF readers
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
      - name: Read original culture sources for review
        run: python3 scripts/verify-latin-culture-sources.py
        env:
          LATIN_CULTURE_SOURCE_OUTPUT: ${{ runner.temp }}/latin-culture-source-originals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latin-culture-source-originals-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/latin-culture-source-originals
          retention-days: 7
          if-no-files-found: error
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Use existing sandboxed Chrome and Japanese fonts
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          echo "REVIEW_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          if [[ -z "$(fc-list ':lang=ja' family)" ]]; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi
          test -n "$(fc-list ':lang=ja' family)"
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/unit/atlas-latin-reading.test.mjs tests/unit/atlas-latin-culture-patterns.test.mjs tests/unit/atlas-latin-agriculture.test.mjs
      - run: npm run build
      - run: node --test tests/e2e/atlas-latin-population.test.mjs tests/e2e/atlas-latin-essential-legends.test.mjs tests/e2e/atlas-latin-workspace-navigation.test.mjs tests/e2e/atlas-regional-workspace-navigation.test.mjs tests/e2e/atlas-latin-forestry-workspace.test.mjs
      - name: Capture and check exact head
        run: node scripts/verify-latin-culture-pc.mjs
        env:
          LATIN_READING_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LATIN_READING_OUTPUT: ${{ runner.temp }}/latin-reading-review/after
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-baseline
          persist-credentials: false
      - name: Capture current main at matching viewport and scroll
        working-directory: .review-baseline
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-latin-culture-pc.mjs"
        env:
          LATIN_READING_BASELINE: '1'
          LATIN_READING_OUTPUT: ${{ runner.temp }}/latin-reading-review/before
      - name: Confirm published farming and forestry geometry stay unchanged
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP+'/latin-reading-review/';
          const before=JSON.parse(readFileSync(dir+'before/report.json'));
          const after=JSON.parse(readFileSync(dir+'after/report.json'));
          assert.deepEqual(after.unchanged,before.unchanged);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latin-reading-pc-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/latin-reading-review
          retention-days: 7
          if-no-files-found: error
