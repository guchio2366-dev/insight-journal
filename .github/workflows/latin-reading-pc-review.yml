name: Latin reading PC review
on:
  pull_request:
    paths:
      - 'src/**/atlas-latin*'
      - 'src/components/atlas/Latin*'
      - 'src/components/atlas/RegionalForestryMap.astro'
      - 'src/data/atlas/latin-america/**'
      - 'public/assets/atlas/latin-review-v3/**'
      - 'tests/**/atlas-latin*'
      - 'scripts/verify-latin-review-revisions-pc.mjs'
      - 'scripts/print-latin-review-revisions-previews.py'
      - 'scripts/verify-latin-industry-sectors-pc.mjs'
      - 'scripts/print-latin-industry-previews.py'
      - '.github/workflows/latin-reading-pc-review.yml'
permissions:
  contents: read
concurrency:
  group: latin-reading-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Use ordinary sandboxed Chrome and Japanese fonts
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          echo "REVIEW_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          if [[ -z "$(fc-list ':lang=ja' family)" ]]; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi
          test -n "$(fc-list ':lang=ja' family)"
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/unit/atlas-latin-reading.test.mjs tests/unit/atlas-latin-review-revisions.test.mjs tests/unit/atlas-latin-culture-patterns.test.mjs tests/unit/atlas-latin-agriculture.test.mjs tests/unit/atlas-latin-nature.test.mjs tests/unit/atlas-latin-water-terrain.test.mjs tests/unit/atlas-latin-nature-reading.test.mjs
      - run: npm run build
      - run: node --test tests/unit/atlas-latin-industry-sectors.test.mjs tests/unit/atlas-latin-industry-expansion.test.mjs tests/unit/atlas-latin-industry.test.mjs tests/e2e/atlas-latin-industry-sectors.test.mjs tests/e2e/atlas-latin-industry.test.mjs
      - run: node --test tests/e2e/atlas-latin-population.test.mjs tests/e2e/atlas-latin-essential-legends.test.mjs tests/e2e/atlas-latin-workspace-navigation.test.mjs tests/e2e/atlas-regional-workspace-navigation.test.mjs tests/e2e/atlas-latin-forestry-workspace.test.mjs tests/e2e/atlas-latin-nature-reading.test.mjs
      - name: Capture and test exact PR head at 1920x1080 and auxiliary 1896x996
        run: node scripts/verify-latin-review-revisions-pc.mjs
        env:
          LATIN_REVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LATIN_REVIEW_OUTPUT: ${{ runner.temp }}/latin-review/after
      - name: Capture and test industry sectors with the same PC viewport and scroll
        run: node scripts/verify-latin-industry-sectors-pc.mjs
        env:
          LATIN_REVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LATIN_INDUSTRY_OUTPUT: ${{ runner.temp }}/latin-review/industry/after
      - name: Export bounded industry PC previews for human inspection
        if: always()
        run: python3 scripts/print-latin-industry-previews.py "$REVIEW_DIRECTORY"
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/latin-review/industry/after
          LATIN_REVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        with:
          ref: a07ab7277b2c7eb89e51ef1be0d72dccfbec497d
          path: .review-baseline
          persist-credentials: false
      - name: Build fixed user-confirmed main and capture matching viewport/scroll
        working-directory: .review-baseline
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-latin-review-revisions-pc.mjs"
          LATIN_INDUSTRY_BASELINE=1 LATIN_INDUSTRY_OUTPUT="$RUNNER_TEMP/latin-review/industry/before" node "$GITHUB_WORKSPACE/scripts/verify-latin-industry-sectors-pc.mjs"
          python3 "$GITHUB_WORKSPACE/scripts/print-latin-industry-previews.py" "$RUNNER_TEMP/latin-review/industry/before"
        env:
          LATIN_REVIEW_BASELINE: '1'
          LATIN_REVIEW_EXPECTED_HEAD: a07ab7277b2c7eb89e51ef1be0d72dccfbec497d
          LATIN_REVIEW_OUTPUT: ${{ runner.temp }}/latin-review/before
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latin-review-revisions-pc-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/latin-review
          retention-days: 7
          if-no-files-found: error
  preview:
    if: ${{ always() && !cancelled() }}
    name: PC image preview (${{ matrix.topic }})
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        topic: [agriculture, forestry, climate, rivers, rainfall, terrain, elevation, population, ethnicity, religion]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: latin-review-revisions-pc-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/latin-review-preview
      - run: python3 scripts/print-latin-review-revisions-previews.py "$REVIEW_DIRECTORY" "$REVIEW_TOPIC"
        env:
          REVIEW_DIRECTORY: ${{ runner.temp }}/latin-review-preview
          REVIEW_TOPIC: ${{ matrix.topic }}
          LATIN_REVIEW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
