name: Latin reading PC review
on:
  pull_request:
    paths:
      - 'src/**/atlas-latin*'
      - 'src/components/atlas/LatinAmerica*'
      - 'src/data/atlas/latin-america/**'
      - 'public/assets/atlas/latin-reading*/**'
      - 'scripts/verify-latin-reading-pc.mjs'
      - '.github/workflows/latin-reading-pc-review.yml'
permissions:
  contents: read
concurrency:
  group: latin-reading-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Use existing sandboxed Chrome and Japanese fonts
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          echo "REVIEW_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          if [[ -z "$(fc-list ':lang=ja' family)" ]]; then
            sudo apt-get update -o APT::Update::Error-Mode=any
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi
          test -n "$(fc-list ':lang=ja' family)"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Capture and check exact head
        run: node scripts/verify-latin-reading-pc.mjs
        env:
          LATIN_READING_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          LATIN_READING_OUTPUT: ${{ runner.temp }}/latin-reading-review/after
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-baseline
          persist-credentials: false
      - name: Capture PR316 dependency at matching viewport and scroll
        working-directory: .review-baseline
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-latin-reading-pc.mjs"
        env:
          LATIN_READING_BASELINE: '1'
          LATIN_READING_OUTPUT: ${{ runner.temp }}/latin-reading-review/before
      - name: Confirm nature and pending industry stay unchanged
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP+'/latin-reading-review/';
          const before=JSON.parse(readFileSync(dir+'before/report.json'));
          const after=JSON.parse(readFileSync(dir+'after/report.json'));
          assert.deepEqual(after.unchanged,before.unchanged);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latin-reading-pc-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/latin-reading-review
          retention-days: 7
          if-no-files-found: error
