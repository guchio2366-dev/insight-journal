name: Validate site

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      export_europe_review_only:
        description: Export four existing Europe review PNGs without testing or capture
        type: boolean
        default: false

# This workflow only reads repository contents. It never publishes the site and
# does not receive Notion credentials or other application secrets.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    if: github.event_name != 'workflow_dispatch' || !inputs.export_europe_review_only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock --no-audit --no-fund
          fi

      # During initial setup this artifact lets the maintainer review and commit
      # the lockfile generated by npm. After it is committed, the same workflow
      # automatically switches to npm ci above.
      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build

      # Real screenshots of this exact build, using Chrome already installed on
      # the runner. No browser downloads, deployment, or additional permissions.
      - name: Capture US and Mexico agriculture review
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          japanese_fonts="$(fc-list ':lang=ja' family)"
          font_setup="preinstalled"
          if [[ -z "$japanese_fonts" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
            japanese_fonts="$(fc-list ':lang=ja' family)"
            font_setup="installed-fonts-noto-cjk-from-ubuntu"
          fi
          if [[ -z "$japanese_fonts" ]]; then
            echo "::error::No Japanese-capable font is available; screenshots would be unreadable."
            exit 1
          fi
          export REVIEW_JAPANESE_FONTS="$japanese_fonts"
          export REVIEW_JAPANESE_FONT_SETUP="$font_setup"
          export REVIEW_JAPANESE_FONT_MATCH="$(fc-match -f '%{family}\n' 'sans-serif:lang=ja'; fc-match -f '%{family}\n' 'serif:lang=ja')"
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::The GitHub runner does not have Google Chrome installed."
            exit 1
          fi
          REVIEW_CHROME_PATH="$chrome_path" npm run test:review:agriculture

      - name: Upload agriculture screenshots and validation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexico-agriculture-review-${{ github.run_id }}
          path: review-artifacts/mexico-agriculture
          if-no-files-found: warn
          retention-days: 7


      - name: Run built-site tests
        run: npm run test:e2e

      - name: Install Chromium for map acceptance
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Compare Canada and US in real Chromium
        run: npm run test:browser:canada
      - name: Upload map acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canada-us-map-acceptance
          path: /tmp/atlas-canada-qa
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify release boundary
        run: npm run verify:release

      - name: Upload built site for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  export-europe-review:
    name: Export four existing Europe review images
    if: github.event_name == 'workflow_dispatch' && inputs.export_europe_review_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out existing images
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the four image files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/review/europe-2026-10-08/agriculture-initial.png
            docs/review/europe-2026-10-08/terrain-landforms.png
            docs/review/europe-2026-10-08/precipitation.png
            docs/review/europe-2026-10-08/industry-initial.png
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum "${files[@]}"

      - name: Upload four existing images
        uses: actions/upload-artifact@v4
        with:
          name: europe-review-four-images-${{ github.run_id }}
          path: |
            docs/review/europe-2026-10-08/agriculture-initial.png
            docs/review/europe-2026-10-08/terrain-landforms.png
            docs/review/europe-2026-10-08/precipitation.png
            docs/review/europe-2026-10-08/industry-initial.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
