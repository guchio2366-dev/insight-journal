name: Validate site

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# This workflow only reads repository contents. It never publishes the site and
# does not receive Notion credentials or other application secrets.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock --no-audit --no-fund
          fi

      # During initial setup this artifact lets the maintainer review and commit
      # the lockfile generated by npm. After it is committed, the same workflow
      # automatically switches to npm ci above.
      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Run built-site tests
        run: npm run test:e2e

      - name: Verify release boundary
        run: npm run verify:release

      - name: Upload built site for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
