name: Review agriculture supply trade and production
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'src/components/atlas/AgroStatistics.astro'
      - 'src/scripts/atlas-agro-statistics.ts'
      - 'src/lib/atlas-agro-statistics.ts'
      - 'src/lib/atlas-agro-statistics-overview.ts'
      - 'src/data/atlas/agro-*flow*'
      - 'src/components/atlas/CropStatistics.astro'
      - 'src/components/atlas/AgricultureDetailPanel.astro'
      - 'src/scripts/atlas-asia-farming-panel.ts'
      - 'src/scripts/atlas-west-asia.ts'
      - 'src/styles/atlas-agro-selected-native.css'
      - 'src/styles/atlas-agro-statistics.css'
      - 'scripts/capture-agro-statistics-review.mjs'
      - 'scripts/run-agro-regional-reviews.mjs'
      - 'scripts/lib/agro-review-identity.mjs'
      - 'src/data/atlas/agro-quantity-coverage.json'
      - 'public/assets/atlas/regional-production-statistics-v1/**'
      - '.github/workflows/agro-statistics-review.yml'
permissions:
  contents: read
concurrency:
  group: agro-statistics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Build the exact reviewed commit
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          npm run build
          node scripts/generate-release.mjs --commit "$REVIEW_HEAD"
      - name: Review three columns in sandboxed Chrome
        env:
          AGRO_PUBLIC_ORIGIN: ${{ github.event_name == 'workflow_run' && 'https://guchio2366-dev.github.io/insight-journal' || '' }}
        run: |
          sudo apt-get install -y fonts-noto-cjk
          REVIEW_CHROME_PATH="$(command -v google-chrome)" node scripts/capture-agro-statistics-review.mjs
      - name: Review all thirteen regional quantity panels
        env:
          AGRO_REVIEW_ROOT: review-artifacts/agro-statistics/regions
        run: |
          REVIEW_CHROME_PATH="$(command -v google-chrome)" node scripts/run-agro-regional-reviews.mjs
      - name: Check mandatory quantity coverage
        # A partial candidate must stay red even if layout and regression checks
        # pass. This gate does not publish or grant any extra permissions.
        if: always()
        run: node scripts/verify-agro-quantity-coverage.mjs --out review-artifacts/agro-statistics/data-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agro-statistics-${{ github.run_id }}
          path: review-artifacts/agro-statistics
          retention-days: 7
